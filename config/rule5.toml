# Rules of the Rule 5 page (viewer/rule5.py): who to protect on the 40-man roster, who could be taken off it, who to draft.
#
# The export flags the players who can be drafted (R5 = Yes) and, where the league has it, the players on the 40-man (secondary)
# roster (the `column` below; "Yes" = on it). A league without that column gets an estimate: the MLB-level players plus the minor
# leaguers with time on the secondary roster who are not draft eligible; the page says so.
#
# A player is READY when his value now is at least `ready_percentile` of the MLB players at his position (a team that drafts him has
# to keep him on its 26-man roster all season, so those are the ones who get picked). He is PROTECT when he is a prospect with
# development left (config/minors.toml) whose ceiling would start in your MLB lineup (the weakest starter at his position, or he is
# a top prospect) and who is ready or a top prospect, or when he is ready and better than a starter of the MLB lineup now (USEFUL). A prospect with that upside
# who is not ready is LOW RISK, the rest is EXPOSE. When the 40-man is full, the players to take off it are the
# ones with the least to keep them: not a starter, no prospect, the lowest value now.

[roster]
size = 40
column = "ON40"

[rules]
ready_percentile = 0.20   # his value now against the MLB players at his position
