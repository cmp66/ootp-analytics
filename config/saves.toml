# One table per save. Folder name under files/ is the save name.
#   source:  "dump"   = OOTP database csv dumps, files/<save>/dumps/<ratings>/<season>/
#            "export" = in-game csv export,      files/<save>/<season>/ (+ ratings/)
#   ratings: name of the ratings/settings set (dump folder name; also keys models trained for this save)
#   ballparks (optional): ballpark ratings csv in files/<save>/; without it the Adj stats equal the plain ones.
#            files/<save>/<season>/ballpark_ratings.csv overrides it for that season.
#   home_share (optional, default 0.5): share of a player's PA / BF played in his own park.
#   [<save>.levels."<level>"] (optional): limits of a minor league level, keyed by the level of the ratings column Lev (AAA, AA, A+,
#            A-, R+, R, INT = the international complex, WL). max_age: the oldest age allowed; max_pro_years: the most years of
#            professional experience allowed (ratings column PROY). 0 = no limit. The depth chart marks the players who exceed
#            the limits of their level.
#   [<save>.team_names] (optional): save team id -> "Team Name" in the ballpark csv. Dump saves match
#            "city nickname" automatically (the table is for exceptions, keyed by team abbreviation or full name);
#            export saves need it: key is the team abbreviation (ratings column TM).

[Model-Sim]
source = "dump"
ratings = "Standard27"
ballparks = "ballpark_ratings.csv"

[Model-Sim-26-Std]
source = "dump"
ratings = "Standard26"
ballparks = "ballpark_ratings.csv"


[Model-Sim.team_names]
