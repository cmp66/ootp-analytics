# Rules of the minor league management page (viewer/minors.py). They follow how the game's "ratings relative to the level" are read:
# a rating is compared with the players of the level, in all organizations, and counts as "green" when it is high enough there.
#
# A player is a PROMOTION candidate when at least `min_green_*` of his key ratings are green at his level (he dominates it) and he
# would not be at the bottom of the next level (the mean percentile of his key ratings among that level's players is at least
# `next_floor`, so he has a chance to succeed). He is an OVERDUE candidate (don't let him stagnate) when he is old for the level
# (age percentile among the players of the level at least `old_for_level`), his ratings are at least average there (mean percentile
# at least `average`) and he would not be at the bottom of the next level. He MUST MOVE when he is over the age or pro-years limit of
# his level (config/saves.toml). He is a DEMOTION candidate when his ratings are weak at his level (mean percentile at most `red`
# and none of his key ratings green). A move is only suggested to a level whose age and pro-years limits he meets (a 26 year old
# does not go down to a level with a maximum age of 25). The statistics of the season are not used: the current ratings are what
# counts (and in a league where potential influences the minor league statistics, such as PBL27, they say even less).
#
# The focus is the development of the better players while they can still develop. A player is a TOP PROSPECT or a PROSPECT when his
# ceiling (the 90th percentile of his best season within ten) stands high among all minor leaguers of his position in the league
# (percentile `top_prospect` / `prospect`), otherwise he is DEPTH. His DEVELOPMENT WINDOW is what is left of the years until the age
# at which players of his kind stop improving. A prospect with a window left is the focus: he needs one key rating less to be moved
# up and counts as old for the level. Depth players and players past their window are filler: moving them matters less, so the page
# lists them only on request (except those who must move because of the limits of their level).

[ratings]  # the key ratings, the columns of player-data
hitters = ["CON", "GAP", "POW", "EYE", "K's", "BABIP"]
pitchers = ["STU", "MOV", "CON.1"]

[rules]  # ~30% of the organization comes out as promotion candidates with these; raise green or min_green_* for fewer
green = 0.70              # percentile among the players of the level from which a rating counts as green
red = 0.25                # mean percentile at or below which a player is weak for his level
average = 0.50            # mean percentile a player has to reach to be moved up for being old for the level
prospect = 0.80           # ceiling percentile among the league's minor leaguers at the position
top_prospect = 0.95
starters = 6              # starting pitchers wanted at every minor league level
pitcher_slack = 1         # a level may have one pitcher more or fewer than its `pitchers` target (config/saves.toml)
position_gap = 2.0        # runs: a hitter listed at a position where another one would add this much is flagged
min_green_hitters = 4     # of the six key ratings
min_green_pitchers = 2    # of the three key ratings
next_floor = 0.35         # mean percentile at the next level a player needs to be moved up there
old_for_level = 0.75      # age percentile among the players of the level from which he is old for it

[development]  # the last age at which the key ratings still grow on average, by game version
# Measured in the training leagues (Model-Sim and Model-Sim-26-Std): the mean yearly change of the key ratings falls to about zero at
# 25 for hitters (+0.1 at 25, 0.0 at 26) and at 26 for pitchers (+0.4 at 26, +0.1 at 27 in OOTP27; +0.2 at 26, -0.1 at 27 in OOTP26).
hitters = { OOTP26 = 25, OOTP27 = 25 }
pitchers = { OOTP26 = 26, OOTP27 = 26 }

[mlb]   # the active roster of the majors and what the level moves page keeps there (the page asks which phase it is)
season = 26             # regular season and playoffs
offseason = 40
spring = 60             # spring training
pitchers = 13           # on the active roster in the season; no target in the offseason or spring training
starters = 5            # of those: starting pitchers (the other 8 are relievers; a starter in the bullpen is the long reliever)
max_option_years = 3    # option years a player has. The first demotion of a season uses one (OPT counts them, OY the demotions this
                        # season): with OPT at 3 and OY at 0 he cannot be sent down without waivers (he is DFA'd); with OY of 1 or more,
                        # or OPT below 3, he can. Without the OPT column in the export there is no information and he can.
floor = 0.35            # a player of the minors is promoted for his value only from this standing among the league's major leaguers

[playing]   # who plays: the value of a player in a slot of a level (viewer/playing.py). Hand-tuned weights; the carry-overs and the
            # position learning are measured (docs/models.md: "Playing time and development", and the notes on growth and positions)
development = 10.0      # utility of the best prospect (ceiling 1.0, five years of window, younger than the level) in a full-time slot
learning = 0.5          # utility per rating point he gains at a position by playing it
current = 6.0           # utility of a player who is the best of his level by his value now (a floor so that a level can field a team)
starter_share = 1.0     # share of the season's playing time of a lineup slot or a rotation spot
bench_share = 0.15      # of a bench player (pinch hitting, injuries)
bullpen_share = 0.30    # of a reliever
age_step = 0.15         # a year younger than the median of the level counts this much more (a year older, less)
age_min = 0.5
age_max = 1.5
window_cap = 5          # years of development window that count
joint_weight = 0.5      # how much who plays where counts in the choice of the levels, against the other reasons for a move (0 = the
                        # levels are chosen as before and the lineups only follow); a hand-tuned guess, see docs/viewer.md
innings = 1000          # innings a full-time fielder plays in a season (for the position learning)
start_rating = 25       # rating at a position he has never played (they start around 20 to 30)
# Train the position he will play in the majors first (C, SS and CF most of all: a 70 or more is a long climb), then move him around.
primary_premium = 1.5   # learning at his own position counts this much more
key_premium = 2.0       # ... and this much at the key positions
key_positions = ["C", "SS", "CF"]
primary_ready = 0.80    # his own position must be this far toward its potential (0 = 20, 1 = the potential) before another counts in full
key_ready = 0.90        # ... at the key positions
before_ready = 0.20     # the share of the learning at another position that counts before that
unfamiliar_hit = 0.30   # a position he is learning costs this x the development value x (1 - how far he is toward its potential)
momentum_scale = 0.10   # development x (1 + this x the extra rating points expected from last year's growth)
momentum_min = 0.5
momentum_max = 2.0
# measured in Model-Sim (TCR on): the extra rating points over the next three years per point gained last year
carry_hitters = 0.80
carry_hitters_potential = 0.19
carry_pitchers = 0.38
carry_pitchers_potential = 0.03
[playing.learn_by_level]  # rating points gained at a position per 100 innings played there, by the place of the level on the ladder
# (Relative80, one season, rating at a position against innings at it by level, with the start rating and the gap to the potential
# as controls): the lower the level the faster, the majors the slowest. Nearly all of it comes in the regular season in that run;
# the user reports more in spring training in the human leagues, which the weekly runs do not show.
mlb = 0.08      # the majors
upper = 0.58    # AAA and AA
a = 1.51        # the two A levels
rookie = 3.29   # the rookie levels and the international complex
