# Install on the Lightsail host next to the NABL file (nothing in that one changes):
#   sudo cp deploy/nginx/ootp.conf /etc/nginx/conf.d/ootp.conf
#   sudo htpasswd -c /etc/nginx/ootp.htpasswd <user>        # apt install apache2-utils
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ootp.wahoosoftware.com           # after the Route 53 A record exists
#
# Streamlit talks over a websocket (/_stcore/stream), so the upgrade headers are needed.

map $http_upgrade $ootp_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ootp.wahoosoftware.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    auth_basic "OOTP viewer";
    auth_basic_user_file /etc/nginx/ootp.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ootp_connection;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
