# The viewer on the Lightsail host, next to (and apart from) the NABL stack:
#   cd /opt/ootp-viewer && docker compose -f deploy/docker-compose.viewer.yml up -d --build
#
# Only the host's nginx reaches it (127.0.0.1:8501). The memory limit keeps a runaway viewer from starving Tomcat and Postgres:
# if it goes over, only this container is killed (and restarted).
name: ootp-viewer

services:
  viewer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 600m
    memswap_limit: 1200m
    env_file:
      - .env          # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION of the read-only user (deploy/.env.example)
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ../files:/app/files
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
